# Exe Value Patcher configuration
#
# The module writes every entry of the section that matches the running game and ignores
# the other one:
#   extreme:  Stronghold_Crusader_Extreme.exe
#   vanilla:  Stronghold Crusader.exe
# Both sections list the same values under the same names; only the addresses differ.
#
# Entry fields
#   name:         only used in the log
#   description:  free text
#   address:      memory address (hex). An address below 0x400000 is read as a file offset,
#                 the format Balanceprog uses, and 0x400000 is added to it.
#   size:         1, 2 or 4 bytes
#   value:        what to write. Negative numbers are fine, and so is Balanceprog's unsigned
#                 form (241 is the same byte as -15, 4294967099 the same as -197).
#   default:      the value in the unmodified game. Optional. When the exe holds something
#                 else, the log gets a warning (wrong address, or the exe was already patched).
#
# Things worth knowing
#   * 1-byte values are sign-extended by the game, so keep them between -128 and 127.
#   * Ranges around units are in tiles and measured as a circle.
#   * "1-player game modes" means campaign missions and custom scenarios. Skirmish, the
#     Crusader trail and multiplayer all use the other value of each pair.
#   * To leave a value alone, delete its entry or comment it out with #.

# true: skip entries whose default does not match what is in the exe.
# false: write them anyway and only warn.
skip_mismatched: false

