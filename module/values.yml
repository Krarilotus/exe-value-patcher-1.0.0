  # --------------------------------------------------------------------------------------
  # Diagonal wall overlays
  # Where a wall runs diagonally, the game fills the corners between its tiles with one of
  # four anim_castle.gm1 frames, 46 to 49 as the game counts them (45 to 48 counting from 0).
  # Which frame a tile gets depends on the direction of the diagonal and on the camera
  # rotation. ViewportRenderState::renderMap draws them with the fixed offsets below; the
  # other axis of each has no offset in the code, so it cannot be changed with a value.
  # Each offset applies to every tile carrying that overlay, not to a single frame.
  # --------------------------------------------------------------------------------------
  - name: offset_wall_diagonal_frame46_y
    description: "Y offset of the diagonal wall overlay using frame 46 (tile flag 0x200)."
    address: 0x4EA1B1
    size: 1
    default: -1
    value: -1
  - name: offset_wall_diagonal_frame47_y
    description: "Y offset of the diagonal wall overlay using frame 47 (tile flag 0x40)."
    address: 0x4EA123
    size: 1
    default: 7
    value: 7
  - name: offset_wall_diagonal_frame48_x
    description: "X offset of the diagonal wall overlay using frame 48 (tile flag 0x100)."
    address: 0x4EA19A
    size: 1
    default: 16
    value: 16
  - name: offset_wall_diagonal_frame49_y
    description: "Y offset of the diagonal wall overlay using frame 49 (tile flag 0x80). A second pass gives neighbouring tiles on the same diagonal other frames through the same flag, so this moves those pieces too."
    address: 0x4EA16B
    size: 1
    default: 98
    value: 98

